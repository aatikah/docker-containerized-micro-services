name: Build, scan, and publish container images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    env:
      REGISTRY_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
      GATEWAY_IMAGE_TAG: v1.0.0
      PRODUCT_IMAGE_TAG: v1.0.0
      ORDER_IMAGE_TAG: v1.0.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker images
        run: |
          docker compose build

      - name: Start stack for health checks
        run: |
          docker compose up -d

      - name: Wait for health endpoints
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:8080/health && break || sleep 5;
          done

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan images
        run: |
          trivy image --severity HIGH,CRITICAL --exit-code 1 your-dockerhub-user/microservices-gateway:v1.0.0 || true
          trivy image --severity HIGH,CRITICAL --exit-code 1 your-dockerhub-user/product-service:v1.0.0 || true
          trivy image --severity HIGH,CRITICAL --exit-code 1 your-dockerhub-user/order-service:v1.0.0 || true

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push images
        if: github.event_name == 'push'
        run: |
          docker tag microservices-gateway:local ${{ secrets.DOCKERHUB_USERNAME }}/microservices-gateway:v1.0.0
          docker tag microservices-product-service:local ${{ secrets.DOCKERHUB_USERNAME }}/product-service:v1.0.0
          docker tag microservices-order-service:local ${{ secrets.DOCKERHUB_USERNAME }}/order-service:v1.0.0
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/microservices-gateway:v1.0.0
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-service:v1.0.0
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/order-service:v1.0.0
